---
name: rebuild_org

on:
  repository_dispatch:
    types: [run_tmate, run]
  schedule:
    - cron: "0 0-4 * * *"
  workflow_dispatch:

env:
  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
  diagnostics:
    name: Run diagnostics
    # This job does not need any permissions
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      # Note that a duplicate of this step must be added at the top of
      # each job.
      - uses: GitHubSecurityLab/actions-permissions/monitor@v1
        with:
          # Uses the organization variable unless overridden
          config: ${{ vars.ACTIONS_PERMISSIONS_CONFIG }}
      # Note that a duplicate of this step must be added at the top of
      # each job.
      - id: harden-runner
        name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - id: github-status
        name: Check GitHub status
        uses: crazy-max/ghaction-github-status@v4
      - id: dump-context
        name: Dump context
        uses: crazy-max/ghaction-dump-context@v2
  dispatch_rebuilds:
    needs:
      - diagnostics
    permissions:
      # actions/checkout needs this to fetch code
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@v1
        with:
          # Uses the organization variable unless overridden
          config: ${{ vars.ACTIONS_PERMISSIONS_CONFIG }}
      - id: harden-runner
        name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Check all organization repositories
        uses: cisagov/action-apb@develop
        with:
          access_token: ${{ env.ACCESS_TOKEN }}
          build_age: "7d"
          event_type: "apb"
          max_rebuilds: 20
          repo_query: "org:cisagov archived:false"
          workflow_id: "build.yml"
      - name: Save apb output as an artifact
        uses: actions/upload-artifact@v3
        with:
          name: apb.json
          path: apb.json
      - name: Generate markdown
        uses: cisagov/action-apb-dashboard@develop
      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          path: wiki
          repository: "${{ github.repository }}.wiki"
          token: ${{ env.ACCESS_TOKEN }}
      - name: Commit changes to wiki
        run: |
          cp apb.md wiki/Home.md
          cd wiki
          git remote set-url origin \
          https://$GITHUB_ACTOR:$ACCESS_TOKEN@github.com/$GITHUB_REPOSITORY.wiki.git
          git config --global user.name $GITHUB_ACTOR
          git config --global user.email $GITHUB_ACTOR@github.com
          git add .
          git commit -m "$GITHUB_EVENT_NAME"
          git push
      - name: Setup tmate debug session
        uses: mxschmitt/action-tmate@v3
        if: github.event_name == 'repository_dispatch' &&
            github.event.action == 'run_tmate'
